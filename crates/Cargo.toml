[workspace]
resolver = "2"

members = [
    "qbz-app",
    "qbz-theme",
    "qbz-models",
    "qbz-audio",
    "qbz-player",
    "qbz-qobuz",
    "qbz-radio",
    "qbz-core",
    "qbz-integrations",
    "qbz-cache",
    "qbz-library",
    "qbz-cast",
    "qbz-cmaf",
    "qbz-dsd",
    "qbz-secrets",
    "qbz-offline-cache",
    "qbz-plex",
    "qconnect-core",
    "qconnect-protocol",
    "qconnect-transport-ws",
    "qconnect-app",
    "qbz-ui",
    "qbz-dac-wizard",
    "qbz-text-utils",
    "qbz-slint-common",
    "qbz",
    "qbz-credentials",
    "qbz-media-controls",
    "qbz-mixtape",
    "qbz-playlist-import",
    "qbz-lyrics",
    "qbz-i18n",
    "qbz-music-link",
    "qbz-reco",
    "qbz-external-reco",
    "qbz-log",
    "qbzd",
]

[workspace.package]
version = "2.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/vicrodh/qbz"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "cookies", "stream"] }

# Logging
log = "0.4"
tracing = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto (Qobuz auth)
md-5 = "0.10"
base64 = "0.22"

# Time
chrono = "0.4"

# Regex
regex = "1"

# Audio
symphonia = { version = "0.5", features = ["all"] }

# Random number generation (shuffle / DJ-mix) — mirrors src-tauri pin
rand = "0.10"

# Fuzzy string similarity (track-mix dedup) — mirrors src-tauri pin
strsim = "0.11"

# Note: Linux-specific dependencies (alsa) go in individual crate Cargo.toml files
# because workspace manifests cannot have [target] sections

[profile.release]
# Strip symbol tables from release binaries. Measured on 2026-07-02:
# 400 MB -> 218 MB (-45%). There are no .debug_* sections in a default
# release build — the weight is .strtab (151 MB) + .symtab (22 MB), inflated
# by Slint's generated generic symbol names. Trade-off: panic backtraces show
# addresses instead of names; the release workflow archives the UNSTRIPPED
# binary as an Actions artifact per tag for offline symbolication.
# Codegen knobs (opt-level / codegen-units / jobs) intentionally stay in the
# workflows' env (CARGO_PROFILE_RELEASE_*) — they are CI-memory tuning, not
# a property of the package.
strip = "symbols"

[patch.crates-io]
# QBZ patches on the femtovg-wgpu renderer (the old swapchain-alpha patch is
# gone: Slint 1.17 honors winit's per-window `transparent` attribute upstream):
#   * #540/#558 — surface-acquire backoff: a wgpu Timeout (Hyprland VFR parks
#     the compositor) or a persistent Outdated (UI-scale/resize race at
#     startup) skips frames with an exponential cooldown instead of blocking
#     the UI thread on every redraw request.
#   * #617 — env-gated partial rendering (SLINT_FEMTOVG_PARTIAL_RENDERING):
#     persistent scene texture + dirty-region repaint + swapchain blit, plus
#     the transform scaffold the core PartialRenderer proxy needs.
#   * cache hygiene on canvas re-creation (Wayland hide/show): clear the
#     graphics/layer/texture caches in reset_canvas so cached layers don't
#     blit dangling image ids on the new canvas.
i-slint-renderer-femtovg = { path = "vendor/i-slint-renderer-femtovg-1.17.1" }
# On modern macOS, fontique's CoreText per-script fallback can fail to resolve
# a Han-script family (the suggested PingFang is not always in the scanned
# family map), so Japanese kanji rendered blank while kana worked. The patch
# pre-registers the known system CJK families (Hiragino/PingFang/Apple SD
# Gothic Neo/Arial Unicode MS, Japanese-biased default) in the fallback map at
# collection creation, which takes priority over the CoreText query. macOS-only
# (#[cfg]); Linux keeps its working fontconfig fallback.
i-slint-common = { path = "vendor/i-slint-common-1.17.1" }
# QBZ patch (issue #588): trackpad scrolling is far too slow on Wayland — the
# Flickable applies pixel-precise wheel deltas 1:1 with no gain, so scroll
# speed lags every other app. The patch boosts pixel-precise (trackpad)
# deltas 2.75x in scroll_delta; discrete wheel line deltas pass unchanged.
# (The old sharedparley elide-first-line patch (#543) is fixed upstream in
# 1.17: the elision rewrite always keeps the first line, slint #12197.)
i-slint-core = { path = "vendor/i-slint-core-1.17.1" }
# Two QBZ patches:
#   * Slint compiles femtovg with the swash raster path. Swash fails to scale
#     some variable fonts at a non-default variation instance (the CFF2-based
#     CJK system fonts on modern macOS), and femtovg cached those glyphs as
#     permanently missing — so CJK text at any non-regular weight rendered
#     blank (#543; regular weight = empty coords = renders fine). The patch
#     retries the glyph at the font's DEFAULT instance before giving up: worst
#     case the glyph draws at regular weight instead of not at all. No effect
#     on fonts/instances that already render.
#   * #617 — keep `current_render_target` in sync with the SetRenderTarget
#     command set_size() queues, so a caller re-asserting an offscreen target
#     right after set_size isn't swallowed by the stale field.
femtovg = { path = "vendor/femtovg-0.25.1" }
# macOS Skia renderer: skia bug 310510989 makes new_from_data fail for TTC
# faces at index > 0, and for some system collections (AppleSDGothicNeo.ttc,
# where EVERY weight sits at index > 0) the upstream read/write-fonts rebuild
# workaround ALSO fails — every Korean glyph run at non-regular weights drew
# nothing. The patch adds a second-chance workaround: resolve the same face
# through CoreText by family name + OS/2 weight, guarded by cmap glyph-id
# spot checks so a wrong match is rejected instead of drawing wrong glyphs.
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia-1.17.1" }
