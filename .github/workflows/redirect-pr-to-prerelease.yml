name: Redirect PRs to pre-release

on:
  # No contributor code is checked out or executed. pull_request_target gives
  # this API-only workflow the write token it needs for PRs opened from forks;
  # pull_request downgrades GITHUB_TOKEN to read-only for those PRs.
  pull_request_target:
    branches: [main]
    types: [opened]

jobs:
  redirect:
    runs-on: ubuntu-latest
    # release-please opens its own PRs straight against main by design —
    # that's how it cuts a tagged release (see CONTRIBUTING.md's Releasing
    # to main section). Its PAT-authored PRs aren't from github-actions[bot]
    # (a fine-grained PAT acts as the user that created it), so branch name
    # is the only reliable discriminator: release-please always names its
    # head ref release-please--branches--<base> (or
    # --components--<component> for multi-package repos). Redirecting one
    # of these to pre-release would silently break every future release —
    # the PR would just sit there, retargeted, with no tag ever cut, no
    # error anywhere to notice.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            // Change base branch from main to pre-release
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              base: 'pre-release'
            });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr.number,
              body: `Base branch changed from \`main\` to \`pre-release\` automatically.\n\nIn this project, \`main\` is reserved for tagged releases. All PRs should target \`pre-release\` for integration testing first. Thanks!`
            });
